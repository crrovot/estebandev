<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="4.5" fill="#ff312e" />
      <circle cx="13" cy="13" r="2.5" fill="#ff312e" />
    </pattern>
    <radialGradient id="fade" cx="42%" cy="44%" r="68%">
      <stop offset="0%" stop-color="white" />
      <stop offset="58%" stop-color="white" stop-opacity=".9" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <mask id="dither-mask">
      <rect width="180" height="180" fill="url(#fade)" />
    </mask>
    <clipPath id="rounded">
      <rect width="180" height="180" rx="38" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="180" height="180" fill="#070707" />
    <circle cx="76" cy="77" r="58" fill="#ff312e" opacity=".14" />
    <g mask="url(#dither-mask)" transform="rotate(-8 90 90)">
      <rect x="-20" y="-20" width="220" height="220" fill="url(#halftone)" />
    </g>
    <path
      d="M-10 139C27 112 51 106 82 112C116 119 139 104 190 59"
      fill="none"
      stroke="#ff312e"
      stroke-width="10"
      stroke-linecap="round"
      opacity=".92"
    />
  </g>
</svg>
